<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Your PC Parts</title>
	<style>
		* { box-sizing: border-box; margin: 0; padding: 0; }
		body { font-family: Arial, sans-serif; background: #080808; color: white; }
		header { background: #050505; border-bottom: 2px solid #d4af37; padding: 25px; text-align: center; }
		header h1 { color: #d4af37; font-size: 38px; }
		header p { color: #aaa; margin-top: 8px; }
		.container { max-width: 1000px; margin: 50px auto; padding: 20px; }
		.budget-box, .build { background: #111; border: 1px solid #333; border-radius: 15px; padding: 30px; box-shadow: 0 0 25px rgba(212,175,55,.08); }
		.budget-box { text-align: center; }
		h2 { color: #d4af37; margin-bottom: 20px; }
		input { width: 250px; padding: 15px; background: #080808; color: white; border: 2px solid #d4af37; border-radius: 8px; font-size: 18px; }
		button { margin-left: 10px; padding: 15px 25px; background: #d4af37; color: #080808; border: 0; border-radius: 8px; font-size: 17px; font-weight: bold; cursor: pointer; }
		button:hover { background: #f0cf55; }
		#result { margin-top: 35px; display: none; }
		.build { padding: 25px; }
		.part { display: flex; justify-content: space-between; padding: 15px 5px; border-bottom: 1px solid #333; }
		.part-name { font-weight: bold; }
		.price, .total { color: #d4af37; }
		.total { margin-top: 20px; font-size: 24px; text-align: right; font-weight: bold; }
		.message { color: #aaa; margin-top: 15px; text-align: center; }
		footer { text-align: center; color: #666; padding: 40px; }
		@media (max-width: 600px) { input { width: 100%; } button { width: 100%; margin: 12px 0 0; } .part { gap: 15px; } }
	</style>
</head>
<body>
	<header>
		<h1>Your PC Parts</h1>
		<p>Find a balanced PC build for your budget.</p>
	</header>
	<main class="container">
		<section class="budget-box">
			<h2>Enter Your Budget</h2>
			<input id="budget" type="number" min="300" step="50" placeholder="e.g. 1000" aria-label="Budget in dollars">
			<button id="buildButton">Build My PC</button>
		</section>
		<section id="result" aria-live="polite"></section>
	</main>
	<footer>&copy; 2025 Your PC Parts</footer>
	<script>
		const builds = [
			{ max: 700, name: 'Entry-Level Gaming Build', parts: [['CPU', 'AMD Ryzen 5 5600', 120], ['GPU', 'Radeon RX 6600', 200], ['RAM', '16GB DDR4', 40], ['Storage', '1TB NVMe SSD', 60], ['Motherboard', 'B550 Motherboard', 100], ['Power Supply', '650W 80+ Bronze', 60], ['Case', 'Airflow Mid Tower', 60]] },
			{ max: 1200, name: 'Balanced Gaming Build', parts: [['CPU', 'AMD Ryzen 5 7600', 200], ['GPU', 'GeForce RTX 4060 Ti', 380], ['RAM', '32GB DDR5', 100], ['Storage', '1TB NVMe SSD', 75], ['Motherboard', 'B650 Motherboard', 160], ['Power Supply', '750W 80+ Gold', 90], ['Case', 'Premium Airflow Case', 90]] },
			{ max: Infinity, name: 'High-End Gaming Build', parts: [['CPU', 'AMD Ryzen 7 7800X3D', 350], ['GPU', 'GeForce RTX 4080 Super', 1000], ['RAM', '32GB DDR5', 120], ['Storage', '2TB NVMe SSD', 140], ['Motherboard', 'X670 Motherboard', 250], ['Power Supply', '850W 80+ Gold', 130], ['Case', 'Premium Full Tower', 150]] }
		];
		const money = value => `$${value.toLocaleString()}`;
		document.getElementById('buildButton').addEventListener('click', () => {
			const budget = Number(document.getElementById('budget').value);
			const result = document.getElementById('result');
			if (!budget || budget < 300) { result.style.display = 'block'; result.innerHTML = '<p class="message">Please enter a budget of at least $300.</p>'; return; }
			const build = builds.find(item => budget <= item.max);
			const total = build.parts.reduce((sum, [, , price]) => sum + price, 0);
			result.style.display = 'block';
			result.innerHTML = `<div class="build"><h2>${build.name}</h2>${build.parts.map(([part, name, price]) => `<div class="part"><span class="part-name">${part}: ${name}</span><span class="price">${money(price)}</span></div>`).join('')}<div class="total">Total: ${money(total)}</div><p class="message">Estimated prices; check current listings before purchasing.</p></div>`;
		});
	</script>
</body>
</html>
